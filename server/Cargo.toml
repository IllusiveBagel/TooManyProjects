[package]
name = "toomanyprojects"
version = "0.1.0"
edition = "2024"
description = "Self-hosted canvas for all your projects"
publish = false

[[bin]]
name = "toomanyprojects"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid", "json"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "set-header", "compression-gzip", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v7", "serde"] }
schemars = "1"
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
chrono-tz = "0.10"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
